name: React CI/CD

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:

  # ========================================
  # CI
  # ========================================
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build

      - name: Verify build output
        run: |
          echo "Build output:"
          ls -la dist

          echo "Checking for localhost references..."

          if grep -R "localhost:7001" dist; then
            echo "ERROR: localhost URL found in production build!"
            exit 1
          fi

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist


  # ========================================
  # CD
  # ========================================
  cd:
    name: CD

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: ci

    runs-on: ubuntu-latest

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist

      - name: Verify downloaded artifact
        run: |
          echo "Downloaded artifact contents:"
          ls -la dist

          echo "Checking artifact for localhost references..."

          if grep -R "localhost:7001" dist; then
            echo "ERROR: localhost URL found in production artifact!"
            exit 1
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true