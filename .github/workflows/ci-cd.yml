name: React CI/CD

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # CI
  # =========================================================
  ci:
    name: CI
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Node.js
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -----------------------------------------------------
      # Dependencies
      # -----------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------
      # Lint
      # -----------------------------------------------------
      - name: Lint
        run: npm run lint

      # -----------------------------------------------------
      # Build
      # -----------------------------------------------------
      - name: Build
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"

          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is not configured."
            exit 1
          fi

          npm run build

      # -----------------------------------------------------
      # Verify production build
      # -----------------------------------------------------
      - name: Verify build output
        run: |
          echo "Build output:"
          ls -la dist

          echo ""
          echo "Checking for localhost references..."

          if grep -R "localhost:7001" dist \
            --include="*.js" \
            --include="*.html"; then

            echo ""
            echo "ERROR: localhost URL found in production build!"
            exit 1
          fi

          echo "No localhost URL found in production JavaScript/HTML."

      # -----------------------------------------------------
      # Verify production API URL
      # -----------------------------------------------------
      - name: Verify production API URL
        run: |
          echo "Checking production API URL..."

          if grep -R "$VITE_API_BASE_URL" dist \
            --include="*.js" \
            --include="*.html"; then

            echo ""
            echo "Production API URL found successfully."
          else

            echo ""
            echo "ERROR: Production API URL was not found in the build!"
            exit 1
          fi

      # -----------------------------------------------------
      # Upload artifact
      #
      # We only need the artifact when deploying to main.
      # -----------------------------------------------------
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist


  # =========================================================
  # CD
  # =========================================================
  cd:
    name: CD

    # CD only runs after a successful CI on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - ci

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Download the exact artifact generated by CI
      # -----------------------------------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist

      # -----------------------------------------------------
      # Verify downloaded artifact
      # -----------------------------------------------------
      - name: Verify downloaded artifact
        run: |
          echo "Downloaded artifact contents:"
          ls -la dist

          echo ""
          echo "Checking artifact for localhost references..."

          if grep -R "localhost:7001" dist \
            --include="*.js" \
            --include="*.html"; then

            echo ""
            echo "ERROR: localhost URL found in production artifact!"
            exit 1
          fi

          echo "No localhost URL found in production artifact."

      # -----------------------------------------------------
      # Deploy to Azure Static Web Apps
      # -----------------------------------------------------
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true